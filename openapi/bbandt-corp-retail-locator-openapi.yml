openapi: 3.0.1
info:
  version: '1.2.0'
  # build: '1'
  title: Branches/ATMs V1.0 API
  description: Branch/ATM Locations API
  contact:
    name: Truist API Support
    url: 'https://developer.truist.com/contact-us'
servers:
  - url: 'https://api-sandbox.truist.com/retail'
    description: Truist Financial Retail Locations
security:
  - BasicAuth: []
tags:
  - name: Location Information
    description: Get ATM and branch location info - latitude, longitude, address, phone and fax

paths:
  ############################################################
  #
  # Locater paths
  #
  ############################################################
  /v1/open-banking/locator:
    get:
      operationId: searchForAll
      tags:
        - Location Information
      summary: Search for All Locations
      description: Query ATMs and Branches for address provided in the payload
      parameters:
        - $ref: '#/components/parameters/Address1Query'
        - $ref: '#/components/parameters/Address2Query'
        - $ref: '#/components/parameters/CityQuery'
        - $ref: '#/components/parameters/StateQuery'
        - $ref: '#/components/parameters/ZipQuery'
        - $ref: '#/components/parameters/LatitudeQuery'
        - $ref: '#/components/parameters/LongitudeQuery'
        - $ref: '#/components/parameters/SearchRadiusQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/LocationType'
      responses:
        '200':
          description: Array
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Locations'
              examples:
                All Locations:
                  value:
                    locations:
                      - locationName: ATM location 1
                        distance: 1.0
                        locationType: ATM
                        phone: (123) 456-7899
                        fax: (123) 456-7899
                        address:
                          address1: 123 example RD
                          address2: ''
                          city: Raleigh
                          state: NC
                          zip: 12345-6789
                          latitude: 35.772
                          longitude: -78.782
                        locationServices:
                          - DEPOSIT TRANSACTIONS
                          - DIRECT RETAIL LOANS
                          - CREDIT CARDS/CONSTANT CRD
                          - SAFE DEPOSIT BOXES
                          - NIGHT DEPOSITORY SERVICE
                          - DRIVE-UP WINDOW
                          - MORTGAGE LOANS
                          - INVESTMENT SERVICES
                          - TRUST SERVICES BY APPT
                          - INTERNATIONAL/RETAIL & WIRE
                          - BUSINESS LOANS BY APPT
                          - MULTICULTURAL CENTER
                        lobbyHours: []
                        driveupWindowHours: []
                      - locationName: Branch location 1
                        distance: 2.0
                        locationType: Branch
                        phone: (123) 456-7899
                        fax: (123) 456-7899
                        address:
                          address1: 123 example RD
                          address2: ''
                          city: Raleigh
                          state: NC
                          zip: 12345-6789
                          latitude: 35.772
                          longitude: -78.782
                        locationServices:
                          - DEPOSIT TRANSACTIONS
                          - DIRECT RETAIL LOANS
                          - CREDIT CARDS/CONSTANT CRD
                          - SAFE DEPOSIT BOXES
                          - NIGHT DEPOSITORY SERVICE
                          - DRIVE-UP WINDOW
                          - MORTGAGE LOANS
                          - INVESTMENT SERVICES
                          - TRUST SERVICES BY APPT
                          - INTERNATIONAL/RETAIL & WIRE
                          - BUSINESS LOANS BY APPT
                          - MULTICULTURAL CENTER
                        lobbyHours:
                          - 'Mon: 09:00-05:00'
                          - 'Tue: 09:00-05:00'
                        driveupWindowHours:
                          - 'Mon: 09:00-05:00'
                          - 'Tue: 09:00-05:00'
        '400':
          description: Bad Request
          headers:
            x-RqUID:
              description: Unique request identifier.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                INVALID_ZIP_CODE:
                  value:
                    code: '401'
                    message: Invalid Input
                INVALID_Lat_Lng:
                  value:
                    code: '401'
                    message: If either Lat or Lng is specified, the other must also be sent
                INVALID_CITY_STATE:
                  value:
                    code: '401'
                    message: Requested City was not found, please add State or Zip
        '401':
          description: Unauthorized
          headers:
            x-RqUID:
              description: Unique request identifier.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                AUTHENTICATION_FAILED:
                  value:
                    code: '603'
                    message: Authentication failed
        '404':
          description: Not Found
          headers:
            x-RqUID:
              description: Unique request identifier.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                RESOURCE_NOT_FOUND:
                  value:
                    code: '404'
                    message: URI does not represent a recognized resource
        '405':
          description: Client called an unimplemented REST method
          headers:
            x-RqUID:
              description: Unique request identifier.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                INVALID_METHOD:
                  value:
                    code: '1206'
                    message: Method Not Allowed
        '429':
          description: Too Many Requests
          headers:
            x-RqUID:
              description: Unique request identifier.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                SPIKE_ARREST_VIOLATION:
                  value:
                    code: '1207'
                    message: Traffic spike, too many requests
                QUOTA_VIOLATION:
                  value:
                    code: '1207'
                    message: Quota violation, too many requests
        '500':
          description: Internal Server Error
          headers:
            x-RqUID:
              description: Unique request identifier.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                INTERNAL_SERVER_ERROR:
                  value:
                    code: '500'
                    message: System down for maintenance
        '503':
          description: Service unavailable / system down for maintenance
          headers:
            x-RqUID:
              description: Unique request identifier.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                SERVICE_UNAVAILABLE:
                  value:
                    code: '503'
                    message: Scheduled Maintenance
        '504':
          description: Service Timed out
          headers:
            x-RqUID:
              description: Unique request identifier
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                GATEWAY_TIMEOUT:
                  value:
                    code: '504'
                    message: A time-out occurred connecting to an upstream server
      security:
        - BasicAuth: []

