components:
  parameters:
    ############################################################
    #
    # Shared request parameters (used by all endpoints)
    #
    ############################################################
    Address1Query:
      name: Address1
      in: query
      required: false
      description: Lookup address.
      schema:
        type: string
        maxLength: 126

    Address2Query:
      name: Address2
      in: query
      required: false
      description: Lookup address continued.
      schema:
        type: string
        maxLength: 126

    CityQuery:
      name: City
      in: query
      required: false
      description: Lookup address city.
      schema:
        type: string
        maxLength: 20

    StateQuery:
      name: State
      in: query
      required: false
      description: Lookup State.
      schema:
        type: string
        maxLength: 2

    ZipQuery:
      name: ZIP
      in: query
      required: false
      description: Lookup ZIP.
      schema:
        type: string
        maxLength: 10
      example: "27604"

    LatitudeQuery:
      name: Lat
      in: query
      required: false
      description: Lookup Latitude.
      schema:
        type: number
        minimum: -90
        maximum: 90

    LongitudeQuery:
      name: Lng
      in: query
      required: false
      description: Lookup Longitude.
      schema:
        type: number
        minimum: -180
        maximum: 180

    SearchRadiusQuery:
      name: SearchRadius
      in: query
      required: false
      description: Radius in miles.
      schema:
        type: integer
        maximum: 99

    LimitQuery:
      name: limit
      in: query
      required: false
      description: Number of elements that the consumer wishes to receive
      schema:
        type: integer
        maxLength: 2
        maximum: 99

    SpanishATMs:
      in: query
      name: SpanishATMs
      required: false
      description: 'BB&T Spanish ATMs?'
      schema:
        $ref: '#/components/schemas/Option'

    LocationType:
      name: LocationType
      in: query
      required: false
      description: Branch or ATM
      schema:
        type: integer
        maxLength: 126

    DriveThroughWindowBranches:
      name: DriveThroughWindowBranches
      in: query
      required: false
      description: 'Drive through window branches?'
      schema:
        $ref: '#/components/schemas/Option'

    SaturdayHoursBranches:
      name: SaturdayHoursBranches
      in: query
      required: false
      description: 'Saturday hours branches?'
      schema:
        $ref: '#/components/schemas/Option'

    NightDepositsBranches:
      name: NightDepositsBranches
      in: query
      required: false
      description: 'Night deposits branches'
      schema:
        $ref: '#/components/schemas/Option'

    SpanishSpeakingBranches:
      name: SpanishSpeakingBranches
      in: query
      required: false
      description: 'Spanish-speaking branches?'
      schema:
        $ref: '#/components/schemas/Option'

  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          description: standard REST HTTP status codes
        message:
          type: string
          description: path of the failing element

    Location:
      type: object
      description: A base ATM or branch location
      properties:
        locationName:
          type: string
          description: Name of ATM or branch location
        distance:
          type: integer
          description: Distance from address provided
        locationType:
          type: string
          description: "Type of the Location"
        phone:
          type: string
          description: Phone number
        fax:
          type: string
          description: Fax number
        address:
          $ref: '#/components/schemas/Address'
        locationServices:
          type: array
          items:
            type: string
        lobbyHours:
          type: array
          items:
            type: string
        driveupWindowHours:
          type: array
          items:
            type: string
    Address:
      type: object
      description: "Location of the branch"
      properties:
        address1:
          type: string
          description: "Address line 1"
        address2:
          type: string
          description: "Address line 2"
        city:
          type: string
          description: "City of branch location"
        state:
          type: string
          description: "State of branch location"
        zip:
          type: string
          description: "Zip code of branch location"
        searchRadius:
          type: string
          description: "Radius in miles of branch location"
        latitude:
          type: number
          format: double
          description: Latitude of the location
        longitude:
          type: number
          format: double
          description: Longitude of the location
    Branches:
      title: Branches Entity
      description: List of Branch Locations
      type: object
      properties:
        branchLocations:
          description: List of Branch Locations
          type: array
          items:
            $ref: '#/components/schemas/Location'
    ATMs:
      title: ATMs Entity
      description: searchForATMs
      type: object
      properties:
        atmLocations:
          description: List of All ATM Locations
          type: array
