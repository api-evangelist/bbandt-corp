        - sent

    RtpStatus:
      title: RTP Submitted Status
      description: >-
        The status of a submitted RTP:
          - needsApproval
          - rejected
          - approved
          - completed
          - canceled
          - scheduled
          - processing
          - rejectedByApprover
          - failed
          - expired
          - all
      type: string
