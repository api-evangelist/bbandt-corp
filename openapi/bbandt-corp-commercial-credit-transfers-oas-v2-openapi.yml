          $ref: "#/components/schemas/PaymentSubType"
        frequency:
          $ref: "#/components/schemas/Frequency"
        paymentDate:
          type: string
          format: date-time
          description: payment execution date time.
        expirationDate:
          type: string
          format: date-time
          description: expiration date after which the payment is invalid.
        amount:
          description: amount of transaction
          type: number
        payFromAccountNumber:
          description: debtor account number
          type: string
        payFromAccountId:
          description: debtor account id.
          type: string
        payFromRoutingNumber:
          description: debtor routing number
          type: string
        payToAccountNumber:
          description: creditor account number
          type: string
        payToAccountId:
          description: creditor account id.
          type: string
        payToRoutingNumber:
          description: creditor routing number
          type: string
        status:
          description: status of the rtp transaction
          $ref: "#/components/schemas/RtpTransactionStatus"
        statusReasonCode:
          description: NARR
          type: string
        statusReasonDescription:
          description: Defines status of the RTP request
          type: string
        description:
          description: transaction memo
          type: string
        recipient:
          type: string
          description: recipient name or any identifying information.
        requiredApprovals:
          type: number
          description: required number of approvals.
        alreadyApproved:
          type: number
          description: current number of approvals granted.
        approvedBy:
          type: array
          description: desc
          items:
            type: object
            properties:
              approverName:
                type: string
                description: Name of the approver
              approvedDate:
                type: string
                format: date-time
                description: approved date and time
      required:
        - paymentId
        - paymentType
        - amount
        - description
        - payToAccountNumber

    PaymentDate:
      type: string
      description: >-
        Date to dispatch the payment. ISO 8601 date as "yyyy-mm-dd".
        Only applicable for future dated(OTFD) and One time payments.
      format: date
    MultipleRtpPaymentRequest:
      title: MultipleRtpPaymentRequest.
      description: Object for holding multiple payment transfers.
      type: object
      properties:
        payments:
          type: array
          description: Payments object for RTP
          items:
            $ref: "#/components/schemas/RtpPaymentRequest"

  responses:
    ############################################################
    #
    # Standard error responses
    #
    ############################################################

    "400":
      description: Bad Request
      headers:
        x-fapi-interaction-id:
          $ref: "#/components/headers/x-fapi-interaction-id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            INVALID_INPUT_OAS:
              value:
                code: "7021" # oas validation
                message: "Specify OAS validation error"

    "401":
      description: Unauthorized
      headers:
        x-fapi-interaction-id:
          $ref: "#/components/headers/x-fapi-interaction-id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            INVALID_ACCESS_TOKEN:
              value:
                code: "603"
                message: Authentication failed

    "403":
      description: Forbidden
      headers:
        x-fapi-interaction-id:
          $ref: "#/components/headers/x-fapi-interaction-id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            ENTITLEMENT_ERROR:
              value:
                code: "602"
                message: Account not entitled
            INSUFFICIENT_SCOPE:
              value:
                code: "403"
                message: Invalid scope

    "404":
      description: Not Found
      headers:
        x-fapi-interaction-id:
          $ref: "#/components/headers/x-fapi-interaction-id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            RESOURCE_NOT_FOUND:
              value:
                code: "1101"
                message: URI does not represent a recognized resource
            INVALID_ACCOUNTID:
              value:
                code: "7059"
                message: Account not found

    "405":
      description: Method Not Allowed
      headers:
        x-fapi-interaction-id:
          $ref: "#/components/headers/x-fapi-interaction-id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            METHOD_NOT_ALLOWED:
              value:
                code: "1206"
                message: Method Not Allowed
    "409":
      description: Conflict
      headers:
        x-fapi-interaction-id:
          $ref: "#/components/headers/x-fapi-interaction-id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            DUPLICATE_PAYMENT_REQUEST:
              value:
                code: "908"
                message: Duplicate payment request
    "429":
      description: Too Many Requests
      headers:
        x-fapi-interaction-id:
          $ref: "#/components/headers/x-fapi-interaction-id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            SPIKE_ARREST_VIOLATION:
              value:
                code: "1207"
                message: Too Many Requests
            QUOTA_VIOLATION:
              value:
                code: "1208"
                message: Quota Violation

    "500":
      description: Internal Server Error
      headers:
        x-fapi-interaction-id:
          $ref: "#/components/headers/x-fapi-interaction-id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            INTERNAL_SERVER_ERROR:
              value:
                code: "500"
                message: "We are currently unable to process your request due to a system issue"
            UNEXPECTED_ERROR:
              value:
                code: "500"
                message: "An unexpected error occurred while processing your request"

    "503":
      description: Service unavailable / system down for maintenance
      headers:
        x-fapi-interaction-id:
          $ref: "#/components/headers/x-fapi-interaction-id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            SERVICE_UNAVAILABLE:
              value:
                code: "503"
                message: "We are currently unable to process your request due to a system issue"

    "504":
      description: Service Timed out
      headers:
        x-fapi-interaction-id:
          $ref: "#/components/headers/x-fapi-interaction-id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            GATEWAY_TIMEOUT:
              value:
                code: "504"
                message: "An unexpected error occurred while processing your request"
