        - rejected
        - approved
        - completed
        - canceled
        - scheduled
        - processing
        - rejectedByApprover
        - failed
        - expired
        - all

    RtpTransactionStatus:
      title: RTP Status of Transaction
      description: >-
        The status of a submitted RTP:
          - needsApproval
          - rejected
          - approved
          - completed
          - canceled
          - scheduled
          - processing
          - rejectedByApprover
          - failed
          - expired
      type: string
      enum:
