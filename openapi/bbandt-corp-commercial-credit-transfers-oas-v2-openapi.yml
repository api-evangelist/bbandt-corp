      description: payment transaction inquiry response payload
      type: object
      properties:
        correlationId:
          description: >-
            The Correlation ID is unique ID made by removing hyphens from a standard UUID
            to make it 32 characters long.
          type: string
        paymentId:
          description: unique payment id.
          type: string
        submittedBy:
          description: initiator id or name.
          type: string
        paymentType:
          description: type of the payment.
          type: string
