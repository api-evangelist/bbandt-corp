- type: Features
  data:
  - name: Open Banking APIs
    description: REST APIs enabling fintech applications to access account and transaction data with customer
      consent.
  - name: Personal Banking APIs
    description: APIs for personal and small business banking account access including balances and transaction
      history.
  - name: Commercial Banking APIs
    description: APIs for commercial account management, treasury operations, and enterprise banking integrations.
  - name: Association Services
    description: Specialized APIs for association management companies to handle dues, payments, and financial
      reporting.
  - name: OAuth 2.0 Authentication
    description: Secure OAuth 2.0 based authentication for customer data access with proper consent flows.
- type: UseCases
  data:
  - name: Personal Finance Apps
    description: Build personal finance management apps that aggregate account and transaction data for
      Truist customers.
  - name: Accounting Software Integration
    description: Integrate Truist commercial accounts with accounting software like QuickBooks or Xero.
  - name: Treasury Management
    description: Enable enterprise treasury teams to access real-time commercial account balances and
      transaction data.
  - name: Association Management
    description: Automate dues collection and financial reporting for homeowners associations and membership
      organizations.
- type: Integrations
  data:
  - name: Plaid
    description: Third-party data aggregator providing alternative connectivity to Truist account data.
  - name: Tink
    description: Open banking platform providing access to Truist banking data via aggregation.
  - name: QuickBooks
    description: Accounting software integration for Truist commercial banking customers.
