aid: bbandt-corp
url: https://raw.githubusercontent.com/api-evangelist/bbandt-corp/refs/heads/main/apis.yml
name: BB&T Corp (Truist)
description: BB&T Corporation merged with SunTrust Banks in December 2019 to form Truist Financial Corporation,
  the sixth-largest US commercial bank. Truist runs an open-banking API program at developer.truist.com
  and publishes fifteen first-party OpenAPI contracts covering 31 operations — personal and small-business
  accounts, transactions, client contact, account address and payment networks; commercial accounts, balances
  and transactions; RTP real-time credit transfers; OAuth 2.0 authentication, customer consent, RFC 7591
  dynamic client registration, event subscriptions and notifications, and a branch/ATM locator. The retail
  surface is built to the Financial Data Exchange (FDX) API (V5.4.1, V6.4.1 and v6.5) and every API carries
  the FAPI x-fapi-interaction-id correlation header. Access is OAuth 2.0 authorization_code with per-customer
  consent; sandbox is self-serve after registration, production requires manual approval by a Truist engagement
  team.
