- status: 401
  meaning: Unauthorized — access token missing, invalid, expired or not approved
- status: 403
  meaning: Forbidden — account not entitled, or the consent/token lacks the required scope
- status: 404
  meaning: Not found — unrecognized URI, account, or no data for the request
- status: 405
  meaning: Method not allowed for this resource
- status: 409
  meaning: Conflict — duplicate payment request (Credit Transfers)
- status: 422
  meaning: Unprocessable entity
- status: 429
  meaning: Too many requests — Apigee spike-arrest (1207) or quota (1208) violation
- status: 500
  meaning: Internal server error / system down for maintenance
- status: 503
  meaning: Service unavailable — an upstream server is unavailable
- status: 504
  meaning: Gateway timeout connecting to an upstream server
