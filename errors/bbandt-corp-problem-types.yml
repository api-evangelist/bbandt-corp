description: 'Truist open-banking APIs return a flat vendor error envelope, not RFC 9457 problem+json. Every error
  body is the FDX `Error` entity: an object with a string `code` (an FDX or Truist-assigned code) and a human-readable
  `message`. The OAuth API uses a separate `APIErrorResponse` envelope. Every error response also carries the `x-fapi-interaction-id`
  correlation header (the retail Branch/ATM Locator returns `x-RqUID` instead), which is the value to quote to Truist
  support.'
