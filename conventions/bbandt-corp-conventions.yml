  cross_link: authentication/bbandt-corp-authentication.yml
request_id_tracing:
  header: x-fapi-interaction-id
  required: true
  direction: sent by the client on the request and echoed by Truist on every response, including every error response
  format: UUID (example c770aef3-6784-41f7-8e0e-ff5f97bddb3a)
  alternate: The Branch/ATM Locator API returns x-RqUID ("Unique request identifier") instead of x-fapi-interaction-id.
  note: This is the FAPI correlation identifier. It is the value to quote to Truist support for a failed call.
idempotency:
  supported: false
  coverage: none
  mechanism: null
  header: null
  note: 'No Idempotency-Key header, retention window or replay semantics appear in any of the 15 published specs, and
    the developer portal documents none. The mutating surface is 8 operations (createRtpCreditTransfer, updatePaymentStatus,
    createRtpCreditTransferApprove, createRtpPaymentAcknowledgment, revokeConsentGrant, createRecipient/updateRecipient/deleteRecipient,
    publishNotification, createNotificationSubscription, deleteNotificationSubscription) and none of them is replay-safe
    by contract. Credit Transfers rejects a repeat submission server-side with HTTP 409, code 908 DUPLICATE_PAYMENT_REQUEST
    — that is duplicate detection, not idempotency: the caller cannot safely retry a timed-out POST and receive the original
    result.'
  evidence: openapi/bbandt-corp-commercial-credit-transfers-oas-v2-openapi.yml#/paths/~1v2~1payments~1rtp~1credit-transfers/post/responses/409
reversibility:
  grade: documented
  applicable: true
  note: Truist publishes real reversal operations for its highest-consequence writes, but states no window for any of
    them. Grade is documented (reversal path present) rather than verified (path plus a stated window).
  surfaces:
  - write: createRtpCreditTransfer
    write_operation: POST /v2/payments/rtp/credit-transfers
    reversal: updatePaymentStatus
    reversal_operation: PUT /v2/payments/rtp/credit-transfers
    mechanism: Submit {"status":"CANCEL","payments":[paymentId]} (schemas CancelPaymentRequest / CancelStatus). The spec
      summary is literally "Credit transfers cancel".
    window: null
    window_note: No window is published. The RtpStatus enum (needsApproval, scheduled, processing, completed, canceled,
      expired) implies cancellation is only meaningful before settlement, but Truist does not state the boundary, and
      RTP settlement on the network is irrevocable. Do not assume a cancel will succeed on a completed payment.
    docs: https://developer.truist.com/api/credit-transfers/documentation
  - write: createRtpCreditTransferApprove
    write_operation: POST /v2/payments/rtp/credit-transfers/approvals
    reversal: createRtpCreditTransferApprove with status REJECT
    reversal_operation: POST /v2/payments/rtp/credit-transfers/approvals
    mechanism: The UpdateStatus enum is APPROVE | REJECT, so a pending payment can be rejected instead of approved from
      the same operation.
    window: null
    window_note: Applies only while the payment is in needsApproval status; no time bound is published.
    docs: https://developer.truist.com/api/credit-transfers/documentation
  - write: consent grant (issued through the OAuth authorization_code flow)
    write_operation: GET /v3/authorize + POST /v3/token
    reversal: revokeConsentGrant
    reversal_operation: PUT /v1/consents/{consentId}/revocation
    mechanism: Revokes an existing customer consent grant; a CONSENT_REVOKED event is then published to subscribers.
    window: null
    window_note: No window published — revocation appears to be available for the life of the consent, but Truist does
      not say so in the contract.
    docs: https://developer.truist.com/api/user-consent/documentation
  - write: createRecipient
    write_operation: POST /v1/register
    reversal: deleteRecipient
    reversal_operation: DELETE /v1/register/{clientId}
    mechanism: RFC 7591 dynamic client registration is fully reversible by deleting the registered client.
    window: null
    window_note: No window published.
    docs: https://developer.truist.com/api/retail-dynamic-client-registration/documentation
  - write: createNotificationSubscription
    write_operation: POST /v1/notification-subscriptions
    reversal: deleteNotificationSubscription
    reversal_operation: DELETE /v1/notification-subscriptions/{subscriptionId}
    mechanism: Subscriptions are deletable by id.
    window: null
    window_note: No window published.
    docs: https://developer.truist.com/api/personal-and-small-business-event-subscriptions/documentation
  irreversible:
  - publishNotification (POST /v1/notifications) — a published event cannot be recalled
  - createRtpPaymentAcknowledgment (POST /v2/payments/rtp/credit-transfers/{paymentId}/acknowledgements) — no un-acknowledge
    operation is published
