description: 'FOCUS-aligned FinOps shape for the Truist (formerly BB&T) developer-portal APIs: partner
  / open-banking program access with banking fees flowing through the underlying customer account relationship,
  not metered per API call.'
notes: No public rate card. Replace meter values with the partner-program agreement once available.
sources:
  - https://developer.truist.com/
principles:
  - name: Visibility
    description: Use the accounts and transactions APIs to surface deposits, payments, and fees back to
      the consuming application or fintech for end-customer attribution.
  - name: Allocation
    description: Allocate banking fees to the originating account holder; allocate API consumption back
      to the partner application via OAuth client identity.
  - name: Optimization
    description: Cache reference data (account metadata, last-known-good balance) to minimize redundant
      polling; prefer event/webhook integration where Truist offers it.
  - name: Accountability
    description: Designate a partner-program owner who manages the Truist developer agreement, monitors
      consent expirations, and reviews fee pass-through monthly.
billingModel:
