capability:
  name: Truist Open Banking
  description: >-
    Truist (BB&T + SunTrust) open banking capabilities through the developer.truist.com
    portal, providing account information and transaction data APIs for personal,
    small business, and commercial banking customers.
  categories:
    - name: Personal and Small Business Accounts
      description: Account information APIs for retail and small business customers.
      operations:
        - name: List Accounts
          description: Retrieve a list of customer accounts with summary information.
        - name: Get Account Details
          description: Retrieve detailed information for a specific account.
        - name: Get Account Balance
          description: Retrieve current and available balance for an account.
    - name: Personal and Small Business Transactions
      description: Transaction history APIs for retail and small business accounts.
      operations:
        - name: List Transactions
          description: Retrieve transaction history for an account.
        - name: Get Transaction Details
          description: Retrieve details for a specific transaction.
    - name: Commercial Accounts
      description: Account information APIs for commercial banking customers.
      operations:
        - name: List Commercial Accounts
          description: Retrieve commercial account list for a business customer.
        - name: Get Commercial Account Details
          description: Retrieve details for a commercial account including credit lines.
        - name: Get Commercial Account Balance
          description: Retrieve current balance and available credit for a commercial account.
    - name: Commercial Account Transactions
      description: Transaction history APIs for commercial banking accounts.
      operations:
        - name: List Commercial Transactions
          description: Retrieve transaction history for commercial accounts.
    - name: Association Services
      description: Specialized APIs for homeowner and membership association banking.
      operations:
        - name: Process Dues Payment
          description: Accept and process membership dues payments.
        - name: Generate Financial Report
          description: Generate financial reports for association board reporting.
