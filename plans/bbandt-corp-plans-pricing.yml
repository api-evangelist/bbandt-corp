description: BB&T Corporation merged with SunTrust in December 2019 to form Truist Financial Corporation;
  the developer portal at developer.truist.com hosts open-banking APIs (accounts, transactions, association
  services). Access is gated behind a Truist developer agreement and is not self-serve. There is no public
  rate card; commercial terms are negotiated under a partner / open-banking program agreement.
notes: No public API pricing. Reconcile with the executed Truist developer / open-banking partner agreement
  once available. The 'BB&T' brand has been retired; live integrations target Truist endpoints.
sources:
  - https://developer.truist.com/
