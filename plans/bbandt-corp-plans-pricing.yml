description: 'Truist publishes no plans, tiers or rate card for its open-banking APIs. There is no pricing page on the
  Truist Developer Center, and no price appears in the product catalog, the get-started content or the terms model —
  all three of which are served anonymously and were read in full on 2026-09-04. Access runs through a single un-priced
  route: register, create an application against the sandbox, then request promotion to production, at which point a
  Truist engagement team works the commercial terms under an executed developer / open-banking agreement (a pre-production
  API license agreement PDF is published at https://content.truist.com/content/dam/caas/open-banking/prod/ob-terms-conditions/pre-production-api-license-agreement.pdf).'
