created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: false
tags:
  - Banking
  - Open Banking
  - Truist
  - Rate Limiting
description: Truist does not publish public per-second or per-minute rate limits for its developer-portal
  APIs. Capacity is set during partner onboarding and disclosed in the developer portal under authentication.
  No numeric values are asserted here.
notes: Reconcile against the application capacity disclosed in the Truist developer portal after onboarding.
  Do not infer numbers from generic open-banking patterns.
sources:
  - https://developer.truist.com/
responseCodes:
  throttled: 429
limits:
  - name: Per-application throttle
    scope: application
    metric: varies
    limit: 'see Truist developer portal post-onboarding'
    notes: Capacity is registered to the partner application; raise via the Truist developer-relations
      contact.
policies:
  - name: Backoff Strategy
    description: Use exponential backoff with jitter on 429; honor Retry-After when returned.
  - name: OAuth Scope Constraints
    description: Endpoints are scoped to consented account access; per-customer consent windows can effectively
      limit throughput beyond raw API capacity.
  - name: Open Banking Compliance
    description: Open-banking endpoints follow FDX-style consent and authorization patterns; non-compliant
      polling can trigger throttling regardless of capacity.
maintainers:
