description: Entity graph of the Truist open-banking estate. The retail side is the FDX Core data model (Account and
  its subclasses DepositAccount / LoanAccount / LocAccount / InvestmentAccount, AccountHolder, Holding, Security, TaxLot),
  the commercial side is a lighter account + transaction model, and Credit Transfers carries an ISO 20022-flavoured RTP
  payment model.
